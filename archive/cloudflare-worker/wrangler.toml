name = "noursky-timeclock"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "noursky-timeclock"
database_id = "REPLACE_WITH_D1_ID"

[triggers]
crons = ["*/15 * * * *"]   # auto-close forgotten sessions

[vars]
ALLOWED_ORIGIN = "https://timeclock.noursky.com"

# Secrets (set via CLI, never commit):
#   wrangler secret put GHL_SHARED_SECRET
#   wrangler secret put SESSION_SECRET
